<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenWrt Devices</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg: #f2efe8;
            --panel: #fffdf8;
            --line: #d9d0c2;
            --text: #2b241c;
            --muted: #73685b;
            --accent: #1f6b5d;
            --warn: #a14a28;
            --online: #2ecc71;
            --offline: #e74c3c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "PingFang SC", "Noto Sans SC", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, #e2efe9 0, transparent 28%),
                radial-gradient(circle at left bottom, #efe1d3 0, transparent 25%),
                var(--bg);
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 14px 28px;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 16px;
            margin-bottom: 14px;
        }

        h1 { margin: 0; font-size: 28px; line-height: 1.1; }
        .sub { margin-top: 8px; color: var(--muted); }

        .panel {
            background: rgba(255, 253, 248, 0.92);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(60, 40, 20, 0.06);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .card { padding: 14px 14px; }
        .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
        .value { margin-top: 6px; font-size: 22px; font-weight: 700; }
        .status-ok { color: var(--accent); }
        .status-warn { color: var(--warn); }

        .table-panel { overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
        th { background: #f7f1e6; color: #5b5145; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
        tr:last-child td { border-bottom: 0; }
        .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

        .mobile-list { display: none; gap: 10px; }
        .device-card { padding: 14px; }
        .device-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
        .device-name { font-size: 18px; font-weight: 700; }
        .device-expire { color: var(--muted); font-size: 12px; white-space: nowrap; }
        .device-ip { margin-top: 4px; color: var(--accent); font-family: "SFMono-Regular", Consolas, monospace; font-size: 15px; }

        .time-range {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .time-range button {
            padding: 8px 16px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--panel);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-range button:hover { border-color: var(--accent); color: var(--accent); }
        .time-range button.active { background: var(--accent); color: white; border-color: var(--accent); }

        .chart-container { width: 100%; height: 500px; margin-top: 14px; }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            padding: 14px;
            margin-top: 14px;
        }

        .stat-item { text-align: center; }
        .stat-value { font-size: 20px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

        .event-log {
            max-height: 300px;
            overflow-y: auto;
            font-size: 13px;
        }

        .event-item {
            padding: 8px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-item:last-child { border-bottom: 0; }

        .event-device { font-weight: 600; }
        .event-time { color: var(--muted); font-size: 12px; }

        .event-online { color: var(--online); }
        .event-offline { color: var(--offline); }

        @media (max-width: 720px) {
            .hero { display: block; }
            h1 { font-size: 24px; }
            .wrap { padding: 14px 10px 24px; }
            .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .value { font-size: 18px; }
            .table-panel { display: none; }
            .mobile-list { display: grid; }
            .chart-container { height: 400px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <div>
                <h1>OpenWrt Device Monitor</h1>
                <div class="sub">页面每 3 秒自动刷新一次，展示服务端最新收到的 DHCP 租约列表。</div>
            </div>
            <div id="refreshText" class="sub">刷新中...</div>
        </div>

        <div class="summary">
            <div class="panel card">
                <div class="label">Router</div>
                <div id="router" class="value">-</div>
            </div>
            <div class="panel card">
                <div class="label">Devices</div>
                <div id="deviceCount" class="value">0</div>
            </div>
            <div class="panel card">
                <div class="label">Last Upload</div>
                <div id="reportedAt" class="value" style="font-size:18px;">-</div>
            </div>
            <div class="panel card">
                <div class="label">Status</div>
                <div id="status" class="value status-warn" style="font-size:18px;">No Data</div>
            </div>
        </div>

        <div class="panel table-panel">
            <table>
                <thead>
                    <tr><th>IP</th><th>Host</th><th>Lease End</th></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td class="empty" colspan="3">暂无设备数据</td></tr>
                </tbody>
            </table>
        </div>

        <div id="mobileList" class="mobile-list">
            <div class="panel device-card"><div class="empty">暂无设备数据</div></div>
        </div>

        <div class="panel">
            <h2 style="padding: 14px 14px 0; margin: 0; font-size: 18px; color: var(--muted);">在线时段</h2>
            <div class="time-range" style="padding: 0 14px;">
                <button data-days="1" class="active">最近1天</button>
                <button data-days="2">最近2天</button>
                <button data-days="3">最近3天</button>
            </div>
            <div id="chart" class="chart-container"></div>
            <h3 style="padding: 14px 14px 0; margin: 0; font-size: 16px; color: var(--muted);">事件记录</h3>
            <div id="eventLog" class="event-log"></div>
        </div>
    </div>

    <script>
        let currentDays = 1;
        let chart = null;

        function formatTime(ts) {
            if (!ts) return "-";
            let value = Number(ts);
            if (!Number.isFinite(value) || value <= 0) return "-";
            if (value < 1000000000000) value = value * 1000;
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "-";
            return date.toLocaleString();
        }

        function formatTimeShort(ts) {
            if (!ts) return "-";
            let value = String(ts);
            // Detect YYMMDDHHmm format (10 digits, e.g., "2605021123")
            if (/^\d{10}$/.test(value)) {
                const yy = parseInt(value.substring(0, 2)) + 2000;
                const mm = parseInt(value.substring(2, 4));
                const dd = parseInt(value.substring(4, 6));
                const hh = parseInt(value.substring(6, 8));
                const min = parseInt(value.substring(8, 10));
                const date = new Date(yy, mm - 1, dd, hh, min);
                if (Number.isNaN(date.getTime())) return "-";
                return date.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            }
            // Fallback: treat as timestamp (ms or s)
            let num = Number(value);
            if (num < 1000000000000) num = num * 1000;
            const date = new Date(num);
            if (Number.isNaN(date.getTime())) return "-";
            return date.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            return String(text == null ? "" : text)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        async function loadClients() {
            const refreshText = document.getElementById("refreshText");
            refreshText.textContent = "刷新中...";
            try {
                const response = await fetch("/video/openwrt/clients", { cache: "no-store" });
                const json = await response.json();
                const data = json.data || {};
                const clients = Array.isArray(data.clients) ? data.clients : [];
                document.getElementById("router").textContent = data.router || "-";
                document.getElementById("deviceCount").textContent = String(clients.length);
                document.getElementById("reportedAt").textContent = formatTime(data.reportedAt);

                const stale = !data.reportedAt || Date.now() - Number(data.reportedAt) > 15000;
                const status = document.getElementById("status");
                status.textContent = stale ? "Stale" : "Online";
                status.className = stale ? "value status-warn" : "value status-ok";

                const tableBody = document.getElementById("tableBody");
                const mobileList = document.getElementById("mobileList");
                if (clients.length === 0) {
                    tableBody.innerHTML = '<tr><td class="empty" colspan="3">暂无设备数据</td></tr>';
                    mobileList.innerHTML = '<div class="panel device-card"><div class="empty">暂无设备数据</div></div>';
                } else {
                    tableBody.innerHTML = clients.map(function (item) {
                        return '<tr><td>' + escapeHtml(item.ip || "-") + '</td><td>' + escapeHtml(item.host || "-") + '</td><td>' + escapeHtml(formatTime(item.leaseEnd)) + '</td></tr>';
                    }).join("");
                    mobileList.innerHTML = clients.map(function (item) {
                        return '<div class="panel device-card"><div class="device-head"><div class="device-name">' + escapeHtml(item.host || "-") + '</div><div class="device-expire">' + escapeHtml(formatTime(item.leaseEnd)) + '</div></div><div class="device-ip">' + escapeHtml(item.ip || "-") + '</div></div>';
                    }).join("");
                }
                refreshText.textContent = "最近刷新: " + new Date().toLocaleTimeString();
            } catch (e) {
                document.getElementById("status").textContent = "Error";
                document.getElementById("status").className = "value status-warn";
                refreshText.textContent = "刷新失败: " + e.message;
            }
        }

        // Convert YYMMDDHHmm string to timestamp (ms) for chart processing
        function parseTimeToTimestamp(timeStr) {
            if (!timeStr) return null;
            const value = String(timeStr);
            if (/^\d{10}$/.test(value)) {
                const yy = parseInt(value.substring(0, 2)) + 2000;
                const mm = parseInt(value.substring(2, 4));
                const dd = parseInt(value.substring(4, 6));
                const hh = parseInt(value.substring(6, 8));
                const min = parseInt(value.substring(8, 10));
                return new Date(yy, mm - 1, dd, hh, min).getTime();
            }
            // Fallback: treat as timestamp (ms or s)
            let num = Number(value);
            if (num < 1000000000000) num = num * 1000;
            return num;
        }

        async function loadHistory() {
            try {
                const endTime = Date.now();
                const startTime = endTime - currentDays * 24 * 60 * 60 * 1000;

                const response = await fetch(`/video/openwrt/history?start=${startTime}&end=${endTime}`, { cache: "no-store" });
                const json = await response.json();
                const records = Array.isArray(json.data) ? json.data : [];

                if (records.length === 0) {
                    document.getElementById('eventLog').innerHTML = '<div class="event-item"><span class="empty">暂无记录</span></div>';
                    if (chart) chart.clear();
                    return;
                }

                // Group by IP and sort events chronologically
                const byIP = {};
                for (const r of records) {
                    if (!byIP[r.ip]) byIP[r.ip] = [];
                    byIP[r.ip].push({
                        status: r.status,
                        time: parseTimeToTimestamp(r.time),
                        host: r.host
                    });
                }

                // Process each IP to find online/offline periods
                const deviceList = Object.keys(byIP).sort((a, b) => {
                    const hostA = byIP[a][0]?.host || '';
                    const hostB = byIP[b][0]?.host || '';
                    return hostA.localeCompare(hostB);
                });

                const series = [];

                deviceList.forEach((ip, idx) => {
                    const events = byIP[ip].sort((a, b) => a.time - b.time);
                    const host = events[0]?.host || '-';
                    const label = `${escapeHtml(host)} (${escapeHtml(ip)})`;

                    let onlineStart = null;
                    let offlineCount = 0;
                    let onlineCount = 0;

                    // Merge consecutive online records into periods
                    for (let i = 0; i < events.length; i++) {
                        const evt = events[i];

                        if (evt.status === 'online') {
                            onlineCount++;
                            if (onlineStart === null) {
                                onlineStart = evt.time;
                            }
                        } else if (evt.status === 'offline') {
                            offlineCount++;
                            if (onlineStart !== null) {
                                // End of an online period
                                const onlineEnd = evt.time;
                                const duration = Math.round((onlineEnd - onlineStart) / 60000);

                                series.push({
                                    name: label,
                                    type: 'bar',
                                    barMaxWidth: 40,
                                    itemStyle: { color: '#2ecc71' },
                                    data: [[onlineStart, 1], [onlineEnd, 1]],
                                    label: {
                                        show: true,
                                        formatter: function(p) {
                                            return duration + '分钟';
                                        },
                                        position: 'insideRight',
                                        fontSize: 11,
                                        color: '#fff'
                                    }
                                });

                                // Mark as offline (gap)
                                series.push({
                                    name: label,
                                    type: 'bar',
                                    barMaxWidth: 5,
                                    itemStyle: { color: '#f0ebe3' },
                                    data: [[onlineEnd, 1], [onlineEnd, 1]],
                                    silent: true
                                });

                                onlineStart = null;
                            }
                        }
                    }

                    // If still online at the end, draw a bar to current time
                    if (onlineStart !== null) {
                        const onlineEnd = endTime;
                        const duration = Math.round((onlineEnd - onlineStart) / 60000);

                        series.push({
                            name: label,
                            type: 'bar',
                            barMaxWidth: 40,
                            itemStyle: { color: '#2ecc71' },
                            data: [[onlineStart, 1], [onlineEnd, 1]],
                            label: {
                                show: true,
                                formatter: function(p) {
                                    return duration + '分钟';
                                },
                                position: 'insideRight',
                                fontSize: 11,
                                color: '#fff'
                            }
                        });
                    }
                });

                // Render event log
                const eventLog = document.getElementById('eventLog');
                const sortedEvents = records.sort((a, b) => b.time - a.time).slice(0, 50);
                eventLog.innerHTML = sortedEvents.map(e => `
                    <div class="event-item">
                        <span class="event-device event-${e.status}">
                            ${e.status === 'online' ? '↑' : '↓'} ${escapeHtml(e.host || '-')} (${escapeHtml(e.ip)})
                        </span>
                        <span class="event-time">${formatTimeShort(e.time)}</span>
                    </div>
                `).join('');

                // Render chart
                if (!chart) {
                    chart = echarts.init(document.getElementById('chart'));
                }

                const option = {
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'shadow' },
                        formatter: function(params) {
                            if (!params || params.length === 0 || params[0].data[0] === params[0].data[1]) return '';
                            const p = params[0];
                            const start = new Date(p.data[0]).toLocaleString('zh-CN');
                            const end = new Date(p.data[1]).toLocaleString('zh-CN');
                            const dur = Math.round((p.data[1] - p.data[0]) / 60000);
                            return `${p.seriesName}<br/>上线: ${start}<br/>下线: ${end}<br/>持续: ${dur}分钟`;
                        }
                    },
                    legend: {
                        type: 'scroll',
                        width: '70%',
                        pageTextStyle: { color: '#73685b' },
                        textStyle: { color: '#2b241c', fontSize: 12 }
                    },
                    grid: {
                        left: '140',
                        right: '80',
                        top: 60,
                        bottom: 40
                    },
                    xAxis: {
                        type: 'time',
                        axisLabel: {
                            formatter: function(value) {
                                return new Date(value).toLocaleString('zh-CN', {
                                    month: '2-digit', day: '2-digit',
                                    hour: '2-digit', minute: '2-digit'
                                });
                            },
                            interval: currentDays === 1 ? 3600000 : (currentDays === 2 ? 10800000 : 21600000)
                        },
                        splitLine: { show: true, lineStyle: { color: '#e8e0d0', type: 'dashed' } }
                    },
                    yAxis: {
                        type: 'category',
                        data: deviceList.map(ip => `${escapeHtml(byIP[ip][0]?.host || '-')} (${escapeHtml(ip)})`),
                        axisLabel: { fontSize: 11 },
                        inverse: false
                    },
                    series: series,
                    dataZoom: [{ type: 'inside', xAxisIndex: 0, filterMode: 'none' }]
                };

                chart.setOption(option, true);

            } catch (e) {
                console.error('Load history error:', e);
            }
        }

        // Time range buttons
        document.querySelectorAll('.time-range button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-range button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDays = parseInt(btn.dataset.days);
                loadHistory();
            });
        });

        window.addEventListener('resize', () => { if (chart) chart.resize(); });

        loadClients();
        setInterval(loadClients, 3000);
        loadHistory();
        setInterval(loadHistory, 60000);
    </script>
</body>
</html>
