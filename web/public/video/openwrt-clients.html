<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenWrt Devices</title>
    <style>
        :root {
            --bg: #f2efe8;
            --panel: #fffdf8;
            --line: #d9d0c2;
            --text: #2b241c;
            --muted: #73685b;
            --accent: #1f6b5d;
            --warn: #a14a28;
            --online: #2ecc71;
            --offline: #e74c3c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "PingFang SC", "Noto Sans SC", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, #e2efe9 0, transparent 28%),
                radial-gradient(circle at left bottom, #efe1d3 0, transparent 25%),
                var(--bg);
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 18px 14px 28px;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 16px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.1;
        }

        h2 {
            margin: 16px 0 10px;
            font-size: 18px;
            color: var(--muted);
        }

        .sub {
            margin-top: 8px;
            color: var(--muted);
        }

        .panel {
            background: rgba(255, 253, 248, 0.92);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(60, 40, 20, 0.06);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .card {
            padding: 14px 14px;
        }

        .label {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .value {
            margin-top: 6px;
            font-size: 22px;
            font-weight: 700;
        }

        .status-ok {
            color: var(--accent);
        }

        .status-warn {
            color: var(--warn);
        }

        .table-panel {
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f7f1e6;
            color: #5b5145;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .empty {
            padding: 28px 16px;
            text-align: center;
            color: var(--muted);
        }

        .mobile-list {
            display: none;
            gap: 10px;
        }

        .device-card {
            padding: 14px;
        }

        .device-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .device-name {
            font-size: 18px;
            font-weight: 700;
        }

        .device-expire {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .device-ip {
            margin-top: 4px;
            color: var(--accent);
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 15px;
        }

        /* Timeline section */
        .timeline-section {
            margin-top: 20px;
        }

        .time-range {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .time-range button {
            padding: 8px 16px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--panel);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-range button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .time-range button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .device-timeline {
            margin-bottom: 16px;
            padding: 14px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .timeline-device-name {
            font-size: 16px;
            font-weight: 600;
        }

        .timeline-device-info {
            font-size: 12px;
            color: var(--muted);
        }

        .timeline-legend {
            display: flex;
            gap: 16px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .legend-dot.online {
            background: var(--online);
        }

        .legend-dot.offline {
            background: var(--offline);
        }

        .timeline-chart {
            position: relative;
            height: 32px;
            background: #f0ebe3;
            border-radius: 4px;
            overflow: hidden;
        }

        .timeline-bar {
            position: absolute;
            top: 0;
            height: 100%;
            transition: left 0.3s, width 0.3s;
        }

        .timeline-bar.online {
            background: var(--online);
        }

        .timeline-bar.offline {
            background: var(--offline);
        }

        .timeline-time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .no-history {
            padding: 20px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 720px) {
            .hero {
                display: block;
            }

            h1 {
                font-size: 24px;
            }

            .wrap {
                padding: 14px 10px 24px;
            }

            .summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .value {
                font-size: 18px;
            }

            .table-panel {
                display: none;
            }

            .mobile-list {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <div>
                <h1>OpenWrt Device Monitor</h1>
                <div class="sub">页面每 3 秒自动刷新一次，展示服务端最新收到的 DHCP 租约列表。</div>
            </div>
            <div id="refreshText" class="sub">刷新中...</div>
        </div>

        <div class="summary">
            <div class="panel card">
                <div class="label">Router</div>
                <div id="router" class="value">-</div>
            </div>
            <div class="panel card">
                <div class="label">Devices</div>
                <div id="deviceCount" class="value">0</div>
            </div>
            <div class="panel card">
                <div class="label">Last Upload</div>
                <div id="reportedAt" class="value" style="font-size:18px;">-</div>
            </div>
            <div class="panel card">
                <div class="label">Status</div>
                <div id="status" class="value status-warn" style="font-size:18px;">No Data</div>
            </div>
        </div>

        <div class="panel table-panel">
            <table>
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Host</th>
                        <th>Lease End</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td class="empty" colspan="3">暂无设备数据</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="mobileList" class="mobile-list">
            <div class="panel device-card">
                <div class="empty">暂无设备数据</div>
            </div>
        </div>

        <div class="timeline-section">
            <h2>在线/离线历史记录</h2>
            <div class="time-range">
                <button data-hours="1" class="active">1小时</button>
                <button data-hours="6">6小时</button>
                <button data-hours="24">24小时</button>
                <button data-hours="168">7天</button>
                <button data-hours="720">30天</button>
            </div>
            <div id="timelineContainer">
                <div class="no-history">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        let currentTimeRange = 12; // hours

        function formatTime(ts) {
            if (!ts) {
                return "-";
            }
            let value = Number(ts);
            if (!Number.isFinite(value) || value <= 0) {
                return "-";
            }
            if (value < 1000000000000) {
                value = value * 1000;
            }
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return "-";
            }
            return date.toLocaleString();
        }

        function formatTimeShort(ts) {
            if (!ts) return "-";
            let value = Number(ts);
            if (value < 1000000000000) value = value * 1000;
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "-";
            return date.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            return String(text == null ? "" : text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        async function loadClients() {
            const refreshText = document.getElementById("refreshText");
            refreshText.textContent = "刷新中...";
            try {
                const response = await fetch("/video/openwrt/clients", {
                    cache: "no-store"
                });
                const json = await response.json();
                const data = json.data || {};
                const clients = Array.isArray(data.clients) ? data.clients : [];
                document.getElementById("router").textContent = data.router || "-";
                document.getElementById("deviceCount").textContent = String(clients.length);
                document.getElementById("reportedAt").textContent = formatTime(data.reportedAt);

                const stale = !data.reportedAt || Date.now() - Number(data.reportedAt) > 15000;
                const status = document.getElementById("status");
                status.textContent = stale ? "Stale" : "Online";
                status.className = stale ? "value status-warn" : "value status-ok";

                const tableBody = document.getElementById("tableBody");
                const mobileList = document.getElementById("mobileList");
                if (clients.length === 0) {
                    tableBody.innerHTML = '<tr><td class="empty" colspan="3">暂无设备数据</td></tr>';
                    mobileList.innerHTML = '<div class="panel device-card"><div class="empty">暂无设备数据</div></div>';
                } else {
                    tableBody.innerHTML = clients.map(function (item) {
                        return '<tr>'
                            + '<td>' + escapeHtml(item.ip || "-") + '</td>'
                            + '<td>' + escapeHtml(item.host || "-") + '</td>'
                            + '<td>' + escapeHtml(formatTime(item.leaseEnd)) + '</td>'
                            + '</tr>';
                    }).join("");
                    mobileList.innerHTML = clients.map(function (item) {
                        return '<div class="panel device-card">'
                            + '<div class="device-head">'
                            + '<div class="device-name">' + escapeHtml(item.host || "-") + '</div>'
                            + '<div class="device-expire">' + escapeHtml(formatTime(item.leaseEnd)) + '</div>'
                            + '</div>'
                            + '<div class="device-ip">' + escapeHtml(item.ip || "-") + '</div>'
                            + '</div>';
                    }).join("");
                }

                refreshText.textContent = "最近刷新: " + new Date().toLocaleTimeString();
            } catch (e) {
                document.getElementById("status").textContent = "Error";
                document.getElementById("status").className = "value status-warn";
                refreshText.textContent = "刷新失败: " + e.message;
            }
        }

        async function loadHistory() {
            const container = document.getElementById("timelineContainer");
            container.innerHTML = '<div class="no-history">加载中...</div>';

            try {
                const endTime = Date.now();
                const startTime = endTime - currentTimeRange * 60 * 60 * 1000;

                const response = await fetch(`/video/openwrt/history?start=${startTime}&end=${endTime}`, {
                    cache: "no-store"
                });
                const json = await response.json();
                const records = Array.isArray(json.data.rows) ? json.data.rows : [];

                if (records.length === 0) {
                    container.innerHTML = '<div class="no-history">暂无历史记录</div>';
                    return;
                }

                // Group by IP
                const byIP = {};
                for (const r of records) {
                    if (!byIP[r.ip]) {
                        byIP[r.ip] = [];
                    }
                    byIP[r.ip].push(r);
                }

                // Sort IPs by host name
                const ips = Object.keys(byIP).sort((a, b) => {
                    const hostA = byIP[a][0]?.host || '';
                    const hostB = byIP[b][0]?.host || '';
                    return hostA.localeCompare(hostB);
                });

                container.innerHTML = ips.map(ip => {
                    const deviceRecords = byIP[ip];
                    const device = deviceRecords[0];
                    return renderTimeline(ip, device);
                }).join('');

                // Render bars after DOM is ready
                ips.forEach(ip => {
                    const deviceRecords = byIP[ip];
                    renderTimelineBars(ip, deviceRecords, startTime, endTime);
                });

            } catch (e) {
                container.innerHTML = '<div class="no-history">加载失败: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderTimeline(ip, device) {
            const host = device?.host || '-';
            return `
                <div class="panel device-timeline">
                    <div class="timeline-header">
                        <div class="timeline-device-name">${escapeHtml(host)}</div>
                        <div class="timeline-device-info">${escapeHtml(ip)}</div>
                    </div>
                    <div class="timeline-legend">
                        <div class="legend-item">
                            <div class="legend-dot online"></div>
                            <span>在线</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot offline"></div>
                            <span>离线</span>
                        </div>
                    </div>
                    <div class="timeline-chart" data-ip="${escapeHtml(ip)}"></div>
                    <div class="timeline-time-labels" data-ip="${escapeHtml(ip)}">
                        <span class="label-start">-</span>
                        <span class="label-end">-</span>
                    </div>
                </div>
            `;
        }

        function renderTimelineBars(ip, records, startTime, endTime) {
            const chart = document.querySelector(`.timeline-chart[data-ip="${CSS.escape(ip)}"]`);
            const labelStart = document.querySelector(`.timeline-time-labels[data-ip="${CSS.escape(ip)}"] .label-start`);
            const labelEnd = document.querySelector(`.timeline-time-labels[data-ip="${CSS.escape(ip)}"] .label-end`);

            if (!chart || !records.length) return;

            const timeRange = endTime - startTime;
            labelStart.textContent = formatTimeShort(startTime);
            labelEnd.textContent = formatTimeShort(endTime);

            // Clear existing bars
            chart.innerHTML = '';

            // Create segments for each minute
            const segments = [];
            let currentTime = startTime;
            const minuteMs = 60000;

            // Build a lookup for online status at each minute
            const statusByMinute = {};
            for (const r of records) {
                const time = Number(r.time);
                statusByMinute[time] = Number(r.online) === 1;
            }

            // Generate segments for each minute in the range
            let inOnline = null;
            let segmentStart = currentTime;

            while (currentTime <= endTime) {
                const isOnline = statusByMinute[currentTime] || false;

                if (inOnline === null) {
                    inOnline = isOnline;
                    segmentStart = currentTime;
                } else if (isOnline !== inOnline) {
                    segments.push({ online: inOnline, start: segmentStart, end: currentTime });
                    inOnline = isOnline;
                    segmentStart = currentTime;
                }

                currentTime += minuteMs;
            }

            // Add final segment
            if (inOnline !== null) {
                segments.push({ online: inOnline, start: segmentStart, end: currentTime });
            }

            // Render segments
            for (const seg of segments) {
                const bar = document.createElement('div');
                bar.className = `timeline-bar ${seg.online ? 'online' : 'offline'}`;

                const left = ((seg.start - startTime) / timeRange) * 100;
                const width = ((seg.end - seg.start) / timeRange) * 100;

                bar.style.left = Math.max(0, left) + '%';
                bar.style.width = Math.min(100 - left, width) + '%';

                chart.appendChild(bar);
            }
        }

        // Time range buttons
        document.querySelectorAll('.time-range button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-range button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTimeRange = parseInt(btn.dataset.hours);
                loadHistory();
            });
        });

        loadClients();
        setInterval(loadClients, 3000);
        loadHistory();
        setInterval(loadHistory, 30000); // Refresh history every 30 seconds
    </script>
</body>
</html>
