        <style>
      html,
      body {
        padding: 0;
        margin: 0;
      }

      
/* 表格样式 */
#stockTable {
    width: 100%;
    border-collapse: collapse;
}

#stockTable th,  td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}

#stockTable th {
    background-color: #f2f2f2;
    position:sticky;
    top:0;
}

#stockTable tr:nth-child(even),
#stockTable tr:nth-child(odd) {
  background-color: #f0f0f0; /* 统一颜色 */
}

.table > :not(caption) > * > * {
    padding: 0.5rem 0.5rem;
    color: var(--bs-table-color-state, var(--bs-table-color-type, var(--bs-table-color)));
    background-color: var(--bs-table-bg);
    border-bottom-width: var(--bs-border-width);
    box-shadow: none;


/* 调整列宽的样式 */
.resizable {
    position: relative;
}

.resizable:after {
    content: '';
    position: absolute;
    right: -3px;
    top: 0;
    bottom: 0;
    width: 6px;
    cursor: col-resize;
}
.modal-backdrop.in {
    filter: alpha(opacity=50);
    opacity: .05;
}

.kLine{
    padding:0 0 0 2;
    color:gray;
}

.stockMoveActions{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-top:4px;
}

.stockMoveButton{
    width:24px;
    height:24px;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid #d0d7de;
    border-radius:4px;
    background:#fff;
    color:#5f6b7a;
}

.stockMoveButton:hover{
    background:#f4f7fb;
    border-color:#9fb3c8;
}

.stockMoveButton .glyphicon{
    top:0;
    font-size:14px;
}

.stockMoveButton .iconRotate90{
    display:inline-block;
    transform:rotate(90deg);
}

.kPeriodTab{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:26px;
    height:18px;
    padding:0 4px;
    border:1px solid #d0d7de;
    border-radius:9px;
    background:#f5f7fa;
    color:#5f6b7a;
}

.kPeriodTab.active{
    background:#dbeafe;
    border-color:#93c5fd;
    color:#1d4ed8;
}

.forceMoveUp{
    color:gray;
}

.moveUp{
    color:gray;
}

.resetMove{
    color:gray;
}

.moveDown{
    color:gray;
}

.forceMoveDown{
    color:gray;
}
.deleteRow{
    padding:0 2 0 2;
}
        </style>

        <div class="flexrow relative">
            <div id="leftPanel" class="flexcolumn paddinglr4" style="position:fixed;top:0;">

    <div id="rows" class="hide">
        <div class="flexcolumn" style="width:500px;">
            <div class="form-floating widthauto margin4" style="width:auto;">
                <select class="form-select broker" aria-label="Default select example">
                    <option value="国信历史">国信历史</option>
                    <option value="国信当日">国信当日</option>
                    <option value="国金港股通当日">国金港股通当日</option>
                    <option value="国金港股通历史">国金港股通历史</option>
                    <option value="国金当日">国金当日</option>
                    <option value="国金qmt成交">国金qmt成交</option>
                    <option value="国金流水">国金流水</option>
                    <option value="国金历史">国金历史</option>
                    <option value="广发当日">广发当日</option>

                    <option value="国信港股通历史">国信港股通历史</option>
