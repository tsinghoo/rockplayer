<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>Stock</title>
        <link rel="stylesheet" href="vendor/bootstrap-5.3.3-dist/css/bootstrap.css">
        <link rel="stylesheet" href="vendor/bootstrap5-dialog-master/dist/css/bootstrap-dialog.css" rel="stylesheet">
        <link rel="stylesheet" href="vendor/lqh.css">
        <link rel="stylesheet" href="vendor/bootstrap-3.3.7-dist/css/glyphicon.css">
        <script src="vendor/math.uuid.js" defer="defer"></script>
        <script src="./js/jquery.js" defer="defer"></script>
        <script src="./vendor/floating-ui/core-1.6.7.js" defer="defer"></script>
        <script src="./vendor/floating-ui/dom-1.6.10.js" defer="defer"></script>
        <script src="vendor/jquery.form.js" defer="defer"></script>
        <script src="vendor/store.legacy.min.js" defer="defer"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
        <script src="vendor/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js" defer="defer"></script>
        <script src="vendor/bootstrap5-dialog-master/dist/js/bootstrap-dialog.js" type="text/javascript" defer="defer"></script>
        <script src="./js/share.js" defer="defer"></script>
        <script src="./stock.js" defer="defer"></script>
        <style>
      html,
      body {
        padding: 0;
        margin: 0;
      }

      
/* 表格样式 */
#stockTable {
    width: 100%;    
    border-collapse: collapse;
}

#stockTable th, #stockTable td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}

#stockTable th {
    background-color: #f2f2f2;
    cursor: col-resize;
    position:sticky;
    top:0;
}

/* 调整列宽的样式 */
.resizable {
    position: relative;
}

.resizable:after {
    content: '';
    position: absolute;
    right: -3px;
    top: 0;
    bottom: 0;
    width: 6px;
    cursor: col-resize;
}
      .modal-backdrop.in {
        filter: alpha(opacity=50);
        opacity: .05;
      }

      #leftPanel {
    position: sticky;
    top: 0;
    z-index: 1; /* 确保 leftPanel 在内容之上 */
}

.kLine{
    padding:0 0 0 2;
    color:gray;
}

.vote{
    padding:0 2 0 2;
    color:gray;
}
.deleteRow{
    padding:0 2 0 2;
}
        </style>
    </head>
    <body>
        <div class="flexrow relative">
            <div>
                <div id="leftPanel" class="flexcolumn paddinglr4">
                    <div class="addButton width100p center clickable padding4">
                        <span class="glyphicon glyphicon-plus" aria-hidden="true"></span>
                    </div>
                    <div id="sqls" class="flexcolumn paddinglr4"></div>
                </div>
            </div>
            <div id="stockTableContainer" class="flexcolumn" style="flex: 1;">
                <table id="stockTable" class="table table-striped">
                    <!-- 表格内容 --></table>
            </div>
        </div>
    </body>
    <div id="rows" class="hide">
        <div class="flexcolumn" style="width:500px;">
            <span>交易记录</span>
            <textarea class="rows" rows="20"></textarea>
            <div class="flexrow center">
                <input type="button" class="submitRows" value="submit">
            </div>
        </div>
    </div>
    <div id="templateActionSheetButton" style="display:none">
        <button id="actionSheetButton#id#" type="button" class="btn btn-primary widthAuto margintb4 #class#">
            #icon# #name#
        </button>
    </div>
    <div id="templateBuySell" style="display:none">
        <div class="flexrow width100p center">
            <div class="form-floating widthauto margin4" style="width:90px;">
                <input
                    type="text"
                    min="5"
                    class="form-control operationName h20"
                    name="operationName"
                    placeholder=" "
                >
                <label class="floating-label">券商</label>
            </div>
            <div class="form-floating widthauto margin4" style="width:90px;">
                <input
                    type="text"
                    min="5"
                    class="form-control sname h20"
                    name="sname"
                    placeholder=" "
                >
                <label class="floating-label">股票名称</label>
            </div>
            <div class="form-floating widthauto margin4" style="width:90px;">
                <input
                    type="text"
                    min="5"
                    class="form-control scode h20"
                    name="scode"
                    placeholder=" "
                >
                <label class="floating-label">股票代码</label>
            </div>
        </div>
        <div class="flexrow width100p">
            <div class="flexcolumn">
                <div class="input-group">
                    <div class="form-floating widthauto margin4" style="width:120px;">
                        <input
                            type="text"
                            min="5"
                            class="form-control buy h20"
                            name="buy"
                            placeholder=" "
                        >
                        <label class="floating-label">买入价</label>
                    </div>
                </div>
                <div class="input-group">
                    <div class="form-floating widthauto margin4" style="width:120px;">
                        <input
                            type="text"
                            min="5"
                            class="form-control bounce h20"
                            name="bounce"
                            placeholder=" "
                        >
                        <label class="floating-label">反弹差价</label>
                    </div>
                </div>
                <div class="input-group">
                    <div class="form-floating widthauto margin4" style="width:120px;">
                        <input
                            type="text"
                            min="5"
                            class="form-control buyAmount h20"
                            name="buyAmount"
                            value="0"
                            placeholder=" "
                        >
                        <label class="floating-label">买入数量</label>
                    </div>
                </div>
            </div>
            <div class="flexcolumn">
                <div class="input-group">
                    <div class="form-floating widthauto margin4" style="width:120px;">
                        <input
                            type="text"
                            min="2"
                            class="form-control sell h20"
                            placeholder=" "
                        >
                        <label class="floating-label">卖出价</label>
                    </div>
                </div>
                <div class="input-group">
                    <div class="form-floating widthauto margin4" style="width:120px;">
                        <input
                            type="text"
                            min="5"
                            class="form-control dip h20"
                            name="pageIndex"
                            placeholder=" "
                        >
                        <label class="floating-label">回落差价</label>
                    </div>
                </div>
                <div class="input-group">
                    <div class="form-floating widthauto margin4" style="width:120px;">
                        <input
                            type="text"
                            min="5"
                            class="form-control sellAmount h20"
                            name="amount"
                            value="0"
                            placeholder=" "
                        >
                        <label class="floating-label">卖出数量</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="flexcolumninline left">
            <div class="flexrow width100p center">
                <div class="form-check form-switch marginlr4">
                    <input
                        type="checkbox"
                        class="buyFirst form-check-input"
                        checked=""
                        aria-label="..."
                    >
                    <span class="">先买后卖</span>
                </div>
                <div class="form-check form-switch marginlr4">
                    <input type="checkbox" class="sellFirst form-check-input" aria-label="...">
                    <span class="">先卖后买</span>
                </div>
            </div>
            <div class="flexrow width100p center">
                <button type="button" class="btn btn-primary widthAuto margin4 buttonConfirm">
                    确认
                </button>
                <button type="button" class="btn btn-outline-primary widthAuto margin4 buttonToAll">
                    所有
                </button>
            </div>
        </div>
    </div>
</html>
