        <style>
      html,
      body {
        padding: 0;
        margin: 0;
      }

      
/* 表格样式 */
#stockTable {
    width: 100%;    
    border-collapse: collapse;
}

#stockTable th, #stockTable td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}

#stockTable th {
    background-color: #f2f2f2;
    cursor: col-resize;
    position:sticky;
    top:0;
}

/* 调整列宽的样式 */
.resizable {
    position: relative;
}

.resizable:after {
    content: '';
    position: absolute;
    right: -3px;
    top: 0;
    bottom: 0;
    width: 6px;
    cursor: col-resize;
}
      .modal-backdrop.in {
        filter: alpha(opacity=50);
        opacity: .05;
      }

      #leftPanel {
    position: sticky;
    top: 0;
    z-index: 1; /* 确保 leftPanel 在内容之上 */
}

.kLine{
    padding:0 0 0 2;
    color:gray;
}

.vote{
    padding:0 2 0 2;
    color:gray;
}
.deleteRow{
    padding:0 2 0 2;
}
        </style>

            <div id="stockTableContainer" class="flexcolumn" style="flex: 1;">

            </div>
        </div>
    </body>
    <div id="rows" class="hide">

            <textarea class="rows" rows="20"></textarea>

                <input type="button" class="submitRows" value="submit">

        </div>
    </div>
    <div id="templateActionSheetButton" style="display:none">
        <button id="actionSheetButton#id#" type="button" class="btn btn-primary widthAuto margintb4 #class#">
