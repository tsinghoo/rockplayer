<!DOCTYPE html>
<html>
    <head>
        <title>标签选择器</title>
        <style>
            .tsTag {
                display: inline-block;
                padding: 6px 12px;
                background-color: #eaeaea;
                margin: 5px;
                cursor: pointer;
                user-select: none;
            }

            .tsTagSelected {
                background-color: #b3b3b3;
                color: white;
            }
            #tsNewTagInput {
                width: 200px;
                padding: 6px 12px;
                font-size: 16px;
                border: none;
            }
            .tsSelectedTags {
                margin-top: 20px;
            }
            .tsSelectedTag {
                margin-right: 5px;
                padding: 6px;
                background-color: #b3b3b3;
                display: inline-flex;
                align-items: center;
            }
            .tsDeleteTagButton {
                margin-left: 5px;
                background-color: #ff4d4f;
                color: white;
                border: none;
                padding: 2px 8px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>标签选择器</h1>

        <div class="tsSelectedTags">
            <div id="selectedTags"></div>
            <input type="text" id="newTagInput" placeholder="输入新标签">
        </div>

        <h4>所有标签：</h4>
        <div id="tagContainer"></div>

        <div class="tsNewTagContainer">
            
            <input type="submit" value="添加" onclick="addNewTag()">
        </div>

        <script>
            var tags = ["标签1", "标签2", "标签3"]; // 这里定义所有的标签

            var selectedTags = []; // 存储用户选择的标签

            var tagContainer = document.getElementById("tagContainer");
            var selectedTagsContainer = document.getElementById("selectedTags");

            // 动态生成标签
            tags.forEach(function (tag) {
                var div = document.createElement("div");
                div.className = "tsTag";
                div.textContent = tag;
                div.addEventListener("click", function () {
                    toggleTagSelection(tag);
                });
                tagContainer.appendChild(div);
            });
            // 切换标签的选中状态
            function toggleTagSelection(tag) {
                var index = selectedTags.indexOf(tag);

                if (index === -1) {
                    selectedTags.push(tag);
                } else {
                    selectedTags.splice(index, 1);
                } refreshSelectedTags();
                refreshTagsDisplay();
            }


            // 刷新标签显示
            function refreshTagsDisplay() {
                var tagElements = document.getElementsByClassName("tsTag");

                for (var i = 0; i < tagElements.length; i++) {
                    var tagElement = tagElements[i];
                    var tagText = tagElement.textContent;

                    if (selectedTags.includes(tagText)) {
                        tagElement.classList.add("tsTagSelected");
                    } else {
                        tagElement.classList.remove("tsTagSelected");
                    }
                }
            }

            // 刷新已选择的标签显示
            function refreshSelectedTags() {
                selectedTagsContainer.innerHTML = "";

                selectedTags.forEach(function (tag) {
                    var div = document.createElement("div");
                    div.classList.add("tsSelectedTag");

                    var span = document.createElement("span");
                    span.textContent = tag;
                    div.appendChild(span);

                    var deleteButton = document.createElement("button");
                    deleteButton.className = "tsDeleteTagButton";
                    deleteButton.textContent = "x";
                    deleteButton.addEventListener("click", function () {
                        deleteSelectedTag(tag);
                    });
                    div.appendChild(deleteButton);

                    selectedTagsContainer.appendChild(div);
                });
            }

            // 删除已选择的标签
            function deleteSelectedTag(tag) {
                var index = selectedTags.indexOf(tag);

                if (index !== -1) {
                    selectedTags.splice(index, 1);
                    refreshSelectedTags();
                }
            }

            // 添加新标签
            function addNewTag() {
                var newTagInput = document.getElementById("newTagInput");
                var newTag = newTagInput.value.trim();

                if (newTag !== "") {
                    tags.push(newTag);

                    selectedTags.push(newTag); // 将新标签同时加入已选择的标签数组中

                    var div = document.createElement("div");
                    div.className = "tsTag";
                    div.textContent = newTag;
                    div.addEventListener("click", function () {
                        toggleTagSelection(newTag);
                    });
                    tagContainer.appendChild(div);

                    newTagInput.value = "";

                    refreshSelectedTags(); // 刷新已选择的标签显示
                    refreshTagsDisplay(); // 刷新标签显示
                }
            }
        </script>
    </body>
</html>
