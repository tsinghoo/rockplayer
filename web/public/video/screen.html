/* 表格样式 */
#stockTable {
    width: 100%;
    border-collapse: collapse;
}

#stockTable th, #stockTable td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}

#stockTable th {
    background-color: #f2f2f2;
    cursor: col-resize;
    position:sticky;
    top:0;
}

/* 调整列宽的样式 */
.resizable {
    position: relative;
}

.resizable:after {
    content: '';
    position: absolute;
    right: -3px;
    top: 0;
    bottom: 0;
    width: 6px;
    cursor: col-resize;
}
      .modal-backdrop.in {
        filter: alpha(opacity=50);
        opacity: .05;
      }

      #leftPanel {
    position: sticky;
    top: 0;
    z-index: 1; /* 确保 leftPanel 在内容之上 */
}
