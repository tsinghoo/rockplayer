    <style>
        html,
        body {
            height: 100%;
        }

        .voicePane {
            flex: 1 1 auto;
            min-width: 0;
        }

        .scriptPane {
            width: 48vw;
            max-width: 760px;
            min-width: 360px;
            background-color: #efefef;
            border-left: 1px solid #d8d8d8;
        }

        #items {
            position: absolute;
            left: 10px;
            right: 0;
            top: 10px;
            bottom: 0;
            overflow: auto;
            padding: 0 12px 80px 0;
        }

        #script {
            overflow: auto;
            padding: 12px 20px 80px;
            font-family: serif;
        }

        .scriptBlock {
            margin-bottom: 14px;
            background: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            overflow: hidden;
        }

        .scriptBlockActive {
            border-color: #198754;
            box-shadow: 0 0 0 1px #198754 inset;
        }

        .scriptLine {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 14px;
            border-top: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .scriptLine:first-child {
            border-top: 0;
        }

        .scriptLine:hover {
            background: #f8fbff;
        }

        .scriptLineActive {
            background: #edf5ff;
        }

        .scriptLinePlaying {
            background: #e4f6ea;
        }

        .scriptTime {
            flex: 0 0 120px;
            color: #666;
            font-family: monospace;
            font-size: 12px;
            line-height: 20px;
        }

        .scriptText {
            flex: 1 1 auto;
            min-width: 0;
            line-height: 20px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #222;
        }

        .scriptEmpty {
            padding: 12px 14px;
            color: #888;
        }

        @media (max-width: 900px) {
            #holder {
                flex-direction: column;
            }

            .scriptPane {
                width: 100%;
                min-width: 0;
                height: 45%;
                border-left: 0;
                border-top: 1px solid #d8d8d8;
            }
        }
    </style>
    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="vendor/html5shiv/3.7.2/html5shiv.min.js"></script>

    <![endif]-->
    <!-- jsCss end -->
</head>

<body>
    <div id="heartbeat" class="heartbeat-info" style="display:none;">
        <span id="heartbeatText">心跳检测中...</span>
    </div>
    <div id="holder" class="flexrow height100p" style="background-color:lightgray;">
        <div class="voicePane height100p">
            <div class="width100p height100p" style="position: relative;">
                <div id="items" class="width100p height100p">
                </div>
            </div>
        </div>
        <div class="scriptPane flexcolumn height100p">
            <div class="flexrow margintb2" style="margin-top:24px;">
                <div>脚本
                </div>
            </div>
            <div id="script" class="flexcolumn bg_gray gray">
                无字幕
            </div>
        </div>
    </div>
    <div id="recent" class="hide"></div>
    <div id="scriptBlockTemplate" class="hide">
        <div id="scriptBlock_#voiceIndex#" class="scriptBlock">
            <div class="scriptBlockBody">#content#</div>
        </div>
    </div>
    <div id="scriptTemplate" class="hide">
        <div id="script_#id#" class="scriptLine" data-id="#id#" data-voice-index="#voiceIndex#" data-start="#start#">
            <div class="scriptIndex">[#index#]</div>
            <div class="scriptTime">#time#</div>
            <div class="scriptText">#script#</div>
        </div>
    </div>
    <div id="editorTemplate" class="hide">
        <div class="flexrow">
            #time#
            <input type="text" class="scriptInput" id="input_#id#" value="#script#">
        </div>
    </div>
    <div id="recentTemplate" class="hide">
        <div id="recent_#id#" class="recentItem">
            #name#
        </div>
    </div>
</body>

</html>
<div id="templateReplacer">
    <div class="flexrow left">
        <input data="#data#" type="checkbox" checked>
        <div class="replacerContent widthauto">#content#</div>
    </div>
</div>
<div id="templateVoice" style="display: none">
    <div id="player_#id#" class="player flexcolumn font12">
        <div class="flexrow width100p aligncenter">
            <input type="checkbox" class="voiceCheckbox marginlr5" data-index="#id#">
            <div class="flexrow center flexgrow1">
                <span class="voiceIndex">#index#. </span>
                <div class="fileName clickable">#fileName#</div>
                <div class="dropdown">
                    <button class="btn btn-link text-decoration-none text-dark p-0 border-0 voiceMoreBtn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                        ...
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item voiceDeleteBtn" href="#" data-index="#id#">删除</a></li>
                        <li><a class="dropdown-item voiceDeleteOldBtn" href="#">删除此前所有文件</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="flexrow widthauto">
            <div id="voiceIcon_#id#" class="voiceIcon"></div>
            <div class="paddinglr10 flexcolumn widthauto">
                <div class="flexcolumn width100p height4"></div>
                <div id="voice_#id#" class="flexrow widthauto">
                    <div id="voiceBody_#id#" class="voiceDuration separator flexcolumn widthauto height20"
                        style="width: _width_px">
                        <div id="progressBar_#id#" class="progressBar center" style="width: 0"></div>
                    </div>
                    <div id="voiceDuration_#id#" class="font12 marginlr2">#duration#</div>
                </div>
            </div>
        </div>
    </div>
</div>
<audio id="audio" preload="preload" style="width: 0px; height: 0px;"></audio>
<div id="templateActionSheetButton" style="display:none">
    <button id="actionSheetButton_#id#" type="button" class="btn btn-info btn-sm widthAuto margintb6">
        #name#
    </button>
</div>
<div id="templateActionSheet" class="hide">
    <div class="row text-center">#content#</div>
    <br>
    <div id="actionSheetButtons" class="flexcolumn">
        #buttons#
    </div>
</div>
<script src="./js/share.js" defer="defer"></script>
<script src="./js/voice.js" defer="defer"></script>
